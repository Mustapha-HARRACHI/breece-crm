name: breece-crm-demo

services:
  demo-mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - demo_mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo-server:
    image: breece-crm-demo-server
    build:
      context: ./server
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://demo-mongodb:27017/breece_crm_demo
      JWT_SECRET: ${DEMO_JWT_SECRET:?Set DEMO_JWT_SECRET for the demo only}
      CLIENT_ORIGIN: http://localhost:5175
      APP_BASE_URL: http://localhost:5175
      NODE_ENV: development
      PORT: 5000
    ports:
      - "127.0.0.1:5002:5000"
    depends_on:
      demo-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-client:
    image: breece-crm-demo-client
    build:
      context: ./client
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://demo-server:5000
    ports:
      - "127.0.0.1:5175:5173"
    depends_on:
      demo-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-seed:
    image: breece-crm-demo-server
    build:
      context: ./server
    profiles: [seed]
    environment:
      MONGODB_URI: mongodb://demo-mongodb:27017/breece_crm_demo
      DEMO_SEED_CONFIRM: ${DEMO_SEED_CONFIRM:-}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:?Set a demo address under example.test}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Set a strong demo password}
      DEMO_ANCHOR_DATE: ${DEMO_ANCHOR_DATE:?Set a YYYY-MM-DD demo anchor date}
    command: ["node", "src/scripts/seedDemo.js"]
    depends_on:
      demo-mongodb:
        condition: service_healthy

volumes:
  demo_mongodb_data:
    name: breece_crm_demo_data
